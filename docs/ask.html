<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>물어보기</title>
<style>
  /* ---------- 토큰: 라이트(기본) ---------- */
  :root{
    --navy:#16233d; --navy-2:#20304f;
    --bg:#eef2f4; --surface:#f8fafb; --surface-2:#e7eef0;
    --border:#c7d5d8; --border-strong:#aec3c8;
    --ink:#151b22; --muted:#5b6a70; --faint:#8a999f;
    --accent:#3f7d8c; --accent-ink:#fff; --accent-soft:#e2edef;
    --ring:rgba(63,125,140,.35);
    /* 팀 */
    --t-dev:#3d5a80; --t-mat:#b8762f; --t-prod:#2f7d5c; --t-qa:#7d5aa0;
    /* 상태 */
    --s-new:#b8862f; --s-prog:#3d5a80; --s-done:#2f7d5c; --s-late:#b8562f;
    /* 소진 예상 위험도: 2개월 미만 빨강 · 4개월 미만 갈색 · 4개월 이상 초록 */
    --risk-1:#c0342c; --risk-2:#b8862f; --risk-3:#2f7d5c;
    --shadow:0 1px 2px rgba(21,27,34,.04), 0 4px 14px rgba(21,27,34,.05);
    --radius:8px;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --navy:#0f1722; --navy-2:#182534;
      --bg:#12181c; --surface:#1a2228; --surface-2:#232d33;
      --border:#2e3b42; --border-strong:#3f4f57;
      --ink:#e6ecef; --muted:#9aa9b0; --faint:#6d7d85;
      --accent:#5fa9ba; --accent-ink:#0b1114; --accent-soft:#1c2c31;
      --ring:rgba(95,169,186,.4);
      --t-dev:#7fa6d4; --t-mat:#e0a85c; --t-prod:#5cba92; --t-qa:#b294d4;
      --s-new:#d9ad5c; --s-prog:#7fa6d4; --s-done:#5cba92; --s-late:#e08a62;
      --risk-1:#f5776a; --risk-2:#e0a252; --risk-3:#5cba92;
      --shadow:0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="dark"]{
    --navy:#0f1722; --navy-2:#182534;
    --bg:#12181c; --surface:#1a2228; --surface-2:#232d33;
    --border:#2e3b42; --border-strong:#3f4f57;
    --ink:#e6ecef; --muted:#9aa9b0; --faint:#6d7d85;
    --accent:#5fa9ba; --accent-ink:#0b1114; --accent-soft:#1c2c31;
    --ring:rgba(95,169,186,.4);
    --t-dev:#7fa6d4; --t-mat:#e0a85c; --t-prod:#5cba92; --t-qa:#b294d4;
    --s-new:#d9ad5c; --s-prog:#7fa6d4; --s-done:#5cba92; --s-late:#e08a62;
    --risk-1:#f5776a; --risk-2:#e0a252; --risk-3:#5cba92;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.35);
  }

  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:var(--bg); color:var(--ink);
    font-family:"Pretendard","Pretendard Variable",-apple-system,BlinkMacSystemFont,
      "Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
    font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased;
  }
  *{box-sizing:border-box}
  html,body{margin:0; height:100%}
  body{
    background:var(--bg); color:var(--ink);
    font-family:"Pretendard","Pretendard Variable",-apple-system,BlinkMacSystemFont,
      "Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
    font-size:14px; line-height:1.55; -webkit-font-smoothing:antialiased;
    display:flex; flex-direction:column; min-height:100vh;
  }
  button{font-family:inherit; cursor:pointer}
  header.top{background:var(--navy); color:#eef3f5; border-bottom:3px solid var(--accent); padding:16px 24px}
  .top-row{display:flex; align-items:center; gap:12px; flex-wrap:wrap}
  .logo-img{height:22px; width:auto; filter:brightness(0) invert(1)}
  .top h1{font-size:20px; margin:0; color:#fbfdfd; font-weight:800; letter-spacing:-.03em}
  .top .sub{font-size:13px; color:#9fb6bd; font-weight:600; padding-left:12px; border-left:1px solid rgba(255,255,255,.22)}
  .top .grow{flex:1}
  .top .conn{border:1px solid rgba(255,255,255,.25); background:rgba(255,255,255,.08); color:#eef3f5;
    font-size:12.5px; font-weight:700; padding:7px 12px; border-radius:7px}
  .top .conn:hover{background:rgba(255,255,255,.16)}
  .status{font-size:11.5px; color:var(--muted); text-align:right; padding:6px 24px 0}
  .status b{color:var(--ink)}
  main{flex:1; display:flex; flex-direction:column; width:100%; max-width:980px; margin:0 auto; padding:10px 16px 0; min-height:0}
  #chat{flex:1; overflow:auto; padding:8px 2px 16px; display:flex; flex-direction:column; gap:12px}
  .msg{max-width:88%; padding:11px 14px; border-radius:12px; line-height:1.6; box-shadow:var(--shadow); word-break:keep-all; overflow-wrap:anywhere}
  .msg.me{align-self:flex-end; background:var(--accent); color:var(--accent-ink); border-bottom-right-radius:4px; white-space:pre-wrap}
  .msg.bot{align-self:flex-start; background:var(--surface); border:1px solid var(--border); border-bottom-left-radius:4px}
  .msg.bot h4{margin:0 0 6px; font-size:14.5px}
  .msg.bot .sm{font-size:12px; color:var(--muted)}
  .msg.bot .big{font-size:22px; font-weight:800; letter-spacing:-.02em}
  .msg.bot table{border-collapse:collapse; margin:6px 0 2px; font-size:12.5px; width:100%}
  .msg.bot th{background:var(--surface-2); color:var(--muted); font-weight:700; text-align:left; padding:5px 8px; border-bottom:1px solid var(--border); white-space:nowrap}
  .msg.bot td{padding:5px 8px; border-bottom:1px solid var(--border); vertical-align:top}
  .msg.bot td.n, .msg.bot th.n{text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap}
  .msg.bot .mono{font-family:ui-monospace,Menlo,Consolas,monospace; font-size:12px}
  .msg.bot .tag{display:inline-block; font-size:11px; font-weight:800; padding:1px 8px; border-radius:999px; margin-left:4px}
  .tag.red{background:color-mix(in srgb,var(--risk-1) 16%,transparent); color:var(--risk-1)}
  .tag.amb{background:color-mix(in srgb,var(--risk-2) 18%,transparent); color:var(--risk-2)}
  .tag.ok{background:color-mix(in srgb,var(--risk-3) 16%,transparent); color:var(--risk-3)}
  .msg.bot .pick{display:flex; flex-wrap:wrap; gap:6px; margin-top:8px}
  .chip{border:1px solid var(--border); background:var(--surface); color:var(--ink); font-size:12.5px; font-weight:600;
    padding:6px 11px; border-radius:999px}
  .chip:hover{border-color:var(--accent); color:var(--accent)}
  .msg.bot .grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:8px; margin:6px 0}
  .msg.bot .kpi{border:1px solid var(--border); border-radius:8px; padding:8px 10px; background:var(--bg)}
  .msg.bot .kpi .k{font-size:11.5px; color:var(--muted); font-weight:700}
  .msg.bot .kpi .v{font-size:17px; font-weight:800}
  .bar{display:flex; align-items:flex-end; gap:3px; height:60px; margin:6px 0 2px}
  .bar i{flex:1; background:var(--accent); border-radius:3px 3px 0 0; min-height:1px; opacity:.85}
  .barx{display:flex; gap:3px; font-size:10px; color:var(--faint)} .barx span{flex:1; text-align:center}
  .chips{display:flex; flex-wrap:wrap; gap:6px; padding:8px 0}
  form.ask{display:flex; gap:8px; padding:8px 0 16px; position:sticky; bottom:0; background:var(--bg)}
  form.ask input{flex:1; border:1px solid var(--border-strong); background:var(--surface); color:var(--ink); border-radius:10px;
    padding:12px 14px; font-size:15px; font-family:inherit; outline:none}
  form.ask input:focus{border-color:var(--accent); box-shadow:0 0 0 3px var(--ring)}
  form.ask button{border:0; background:var(--accent); color:var(--accent-ink); font-weight:800; border-radius:10px; padding:0 18px; font-size:14px}
  form.ask button:disabled{opacity:.5; cursor:wait}
  .typing{font-size:12px; color:var(--muted)}
  @media (max-width:640px){ .top .sub{display:none} .msg{max-width:96%} }
</style>
</head>

<script>
(function(){
"use strict";
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=v=>(Math.round((+v||0)*10)/10).toLocaleString();
const won=v=>"₩"+Math.round(+v||0).toLocaleString();

/* ===================== 엑셀 읽기 (구매요청 대시보드와 같은 가벼운 읽기) ===================== */
  // .xlsx = zip(xml). 외부 라이브러리 없이 브라우저 압축해제(DecompressionStream)로 파싱
  async function inflateRaw(bytes){
    if(typeof DecompressionStream==="undefined") throw new Error("이 브라우저는 xlsx 자동 해제를 지원하지 않아요. CSV로 저장해 올려주세요");
    const st=new Blob([bytes]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
    return new Uint8Array(await new Response(st).arrayBuffer());
  }
  async function unzip(u8){
    const dv=new DataView(u8.buffer,u8.byteOffset,u8.byteLength);
    let eocd=-1;
    for(let i=u8.length-22;i>=0;i--){ if(dv.getUint32(i,true)===0x06054b50){ eocd=i; break; } }
    if(eocd<0) throw new Error("올바른 엑셀(.xlsx) 파일이 아닙니다");
    const count=dv.getUint16(eocd+10,true); let off=dv.getUint32(eocd+16,true);
    const out={}; const td=new TextDecoder();
    for(let e=0;e<count && dv.getUint32(off,true)===0x02014b50; e++){
      const method=dv.getUint16(off+10,true), compSize=dv.getUint32(off+20,true);
      const fnLen=dv.getUint16(off+28,true), exLen=dv.getUint16(off+30,true), cmLen=dv.getUint16(off+32,true);
      const localOff=dv.getUint32(off+42,true);
      const nm=td.decode(u8.subarray(off+46,off+46+fnLen));
      const lFn=dv.getUint16(localOff+26,true), lEx=dv.getUint16(localOff+28,true);
      const ds=localOff+30+lFn+lEx, comp=u8.subarray(ds,ds+compSize);
      if(/sharedStrings|styles|worksheets\/sheet|workbook\.xml$/.test(nm)){
        out[nm] = method===0 ? comp.slice() : await inflateRaw(comp);
      }
      off+=46+fnLen+exLen+cmLen;
    }
    return out;
  }
  function serialToDate(s){ const d=new Date(Date.UTC(1899,11,30)+Math.round(s)*86400000);
    if(isNaN(d)) return String(s);
    return d.getUTCFullYear()+"-"+String(d.getUTCMonth()+1).padStart(2,"0")+"-"+String(d.getUTCDate()).padStart(2,"0"); }
  function erpNorm(v){
    const s=String(v==null?"":v);
    let out="";
    for(let i=0;i<s.length;i++) if(s.charCodeAt(i)>31) out+=s.charAt(i);
    return out.replace(/^"+|"+$/g,"").trim();
  }
  function erpHdrKey(v){ return erpNorm(v).replace(/\s+/g,""); }
  function erpNum(v){ const n=parseFloat(String(v==null?"":v).replace(/,/g,"").replace(/[^0-9.\-]/g,"")); return isFinite(n)?n:0; }
  function erpKey(c){ return String(c==null?"":c).trim().toUpperCase().replace(/\s+/g,""); }
  // ERP CSV 는 따옴표 안에 탭이 섞여 나오는 경우가 있어 따옴표 규칙을 먼저 적용한다
  function erpParseText(text){
    text=String(text).replace(/^﻿/,"").replace(/\r\n?/g,"\n");
    const rows=[]; let row=[], cur="", q=false;
    for(let i=0;i<text.length;i++){ const c=text[i];
      if(q){ if(c==='"'){ if(text[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=c; }
      else if(c==='"') q=true;
      else if(c===','){ row.push(cur); cur=""; }
      else if(c==='\n'){ row.push(cur); rows.push(row); row=[]; cur=""; }
      else cur+=c;
    }
    if(cur!==""||row.length){ row.push(cur); rows.push(row); }
    const wide=rows.reduce((m,r)=>Math.max(m,r.length),0);
    if(wide>=2) return rows;
    return text.split("\n").map(l=>l.split("\t"));   // 진짜 TSV
  }
  function erpUnesc(s){
    if(s.indexOf("&")<0) return s;
    return s.replace(/&(lt|gt|amp|quot|apos|#\d+|#x[0-9a-fA-F]+);/g,(m,e)=>{
      if(e==="lt") return "<"; if(e==="gt") return ">"; if(e==="amp") return "&";
      if(e==="quot") return '"'; if(e==="apos") return "'";
      if(e.charAt(0)==="#"){ const n = e.charAt(1)==="x" ? parseInt(e.slice(2),16) : +e.slice(1);
        return isFinite(n) ? String.fromCodePoint(n) : m; }
      return m;
    });
  }
  async function erpReadXlsx(buf){
    const files=await unzip(new Uint8Array(buf));
    const td=new TextDecoder();
    const dec=nm=> files[nm] ? td.decode(files[nm]) : "";

    const shared=[]; const ssx=dec("xl/sharedStrings.xml");
    if(ssx){
      const siRe=/<si\b[^>]*>([\s\S]*?)<\/si>/g; let m;
      while((m=siRe.exec(ssx))){
        let s=""; const tRe=/<t\b[^>]*>([\s\S]*?)<\/t>/g; let t;
        while((t=tRe.exec(m[1]))) s+=t[1];
        shared.push(erpUnesc(s));
      }
    }
    const dateStyle=[]; const stx=dec("xl/styles.xml");
    if(stx){
      const fmt={}; const fRe=/<numFmt\b[^>]*numFmtId="(\d+)"[^>]*formatCode="([^"]*)"/g; let f;
      while((f=fRe.exec(stx))) fmt[f[1]]=erpUnesc(f[2]);
      const isDate=id=>{ const k=+id; if((k>=14&&k<=22)||(k>=45&&k<=47)) return true;
        const c=fmt[id]; return c ? /[dmy]/i.test(c.replace(/\[[^\]]*\]/g,"").replace(/"[^"]*"/g,"")) : false; };
      const cx=stx.match(/<cellXfs\b[\s\S]*?<\/cellXfs>/);   // cellStyleXfs 가 아니라 cellXfs
      if(cx){ const xRe=/<xf\b[^>]*>/g; let x, i=0;
        while((x=xRe.exec(cx[0]))){ const id=(x[0].match(/numFmtId="(\d+)"/)||[])[1]||"0"; dateStyle[i++]=isDate(id); } }
    }
    const sheetNm=Object.keys(files).filter(n=>/^xl\/worksheets\/sheet\d+\.xml$/.test(n)).sort()[0];
    if(!sheetNm) throw new Error("워크시트를 찾을 수 없습니다");
    const xml=dec(sheetNm);
    const rows=[]; const rowRe=/<row\b[^>]*>([\s\S]*?)<\/row>/g; let r;
    const cellRe=/<c\b([^>]*?)(?:\/>|>([\s\S]*?)<\/c>)/g;
    while((r=rowRe.exec(xml))){
      const cells=[]; let c; cellRe.lastIndex=0;
      while((c=cellRe.exec(r[1]))){
        const at=c[1]||"", body=c[2]||"";
        const ref=(at.match(/r="([A-Z]+)/)||[])[1]||"";
        const t=(at.match(/t="([^"]*)"/)||[])[1]||"";
        const s=(at.match(/s="(\d+)"/)||[])[1];
        let col; if(ref){ col=0; for(let i=0;i<ref.length;i++) col=col*26+(ref.charCodeAt(i)-64); col--; } else col=cells.length;
        let val="";
        if(t==="s"){ const v=(body.match(/<v>([\s\S]*?)<\/v>/)||[])[1]; val=shared[+v]||""; }
        else if(t==="inlineStr"){ let s2=""; const tRe=/<t\b[^>]*>([\s\S]*?)<\/t>/g; let tm;
          while((tm=tRe.exec(body))) s2+=tm[1]; val=erpUnesc(s2); }
        else { const v=(body.match(/<v>([\s\S]*?)<\/v>/)||[])[1];
          const raw=(v==null)?"":erpUnesc(v);
          val=(raw!=="" && s!=null && dateStyle[+s]) ? serialToDate(+raw) : raw; }
        cells[col]=val;
      }
      for(let i=0;i<cells.length;i++) if(cells[i]==null) cells[i]="";
      rows.push(cells);
    }
    return rows;
  }

/* ===================== 자료 ===================== */
// 쉐어포인트 MMS 폴더(두 회사)의 최신 파일을 읽어 질문에 답할 자료로 만든다. 모두 읽기만 한다.
const COS=["태성정밀","플로우텍"];
const GROUPCO=["태성정밀","플로우텍"];
const BAD_WH=/불량/;
const coName=v=>erpNorm(v).replace(/\s+/g,"").replace(/㈜|\(주\)|주\)|\(유\)|유\)|주식회사|유한회사/g,"");
const isGroup=v=>GROUPCO.indexOf(coName(v))>=0;
const REPORTS=["품목정보","창고별재고현황","재고현황","판매현황_전체","구매현황_전체","BOM","주문서현황"];
const PO_PATH="발주현황/발주현황.json";   // 발주현황 대시보드가 파워오토메이트로 올려 두는 발주 목록(있으면)
let DB=null;
// 합금 원료 · 잉곳 · 광재는 담당 품목이 아니라 기본으로 뺀다 (구매요청 대시보드와 같은 목록 + 품명에 잉곳·광재)
// 질문에 '잉곳 포함'이라고 쓰면 넣어서 답한다.
const ALLOY=new Set(["Zn","Al","ALB","Pb","Bi","Ni","Sn","CuP","Sb","Cu.1","Brass.1","Brass.5","C89540","C6802","Slag"].map(c=>c.toUpperCase()));
const isAlloy=c=>{ const k=String(c||"").trim().toUpperCase(); if(ALLOY.has(k) || /^(INGOT|CHIP-)/.test(k)) return true;
  const n=(DB && DB.items[c] && DB.items[c].n)||""; return /잉곳|광재/.test(n); };
let INCL_ALLOY=false;
const skip=c=>!INCL_ALLOY && isAlloy(c);

function ymd(v){                      // 어떤 모양의 날짜든 'YYYY-MM-DD'
  const s=erpNorm(v).replace(/[./]/g,"-");
  let m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/) || s.match(/^(\d{4})(\d{2})(\d{2})(?:\D|$)/);
  if(m) return m[1]+"-"+String(m[2]).padStart(2,"0")+"-"+String(m[3]).padStart(2,"0");
  const n=parseFloat(s);
  if(n>20000 && n<80000) return serialToDate(n);
  return "";
}
function hdr(rows, need){
  for(let i=0;i<Math.min(rows.length,20);i++){
    const r=(rows[i]||[]).map(erpHdrKey);
    if(need.every(k=>r.indexOf(k)>=0)) return i;
  }
  return -1;
}
function colsOf(rows,hi){ const m={}; (rows[hi]||[]).forEach((c,i)=>{ const k=erpHdrKey(c); if(k && m[k]==null) m[k]=i; }); return m; }
const pick=(m,names)=>{ for(const n of names) if(m[n]!=null) return m[n]; return null; };

      for(const r of rows.slice(hi+1)){ const code=erpNorm(r[cC]); if(!code) continue; const it=item(code);
        if(cN!=null && !it.n) it.n=erpNorm(r[cN]); if(cK!=null && !it.k) it.k=erpNorm(r[cK]).replace(/^\[|\]$/g,"");

      for(const r of rows.slice(hi+1)){ const code=erpNorm(r[cC]); if(!code || /^합\s*계$/.test(code)) continue; const it=item(code);
        if(cN!=null && !it.n) it.n=erpNorm(r[cN]); if(cB!=null && !it.b) it.b=erpNorm(r[cB]);

      const cD=pick(c,["일자"]), cC=c["품목코드"], cQ=c["수량"], cN=pick(c,["품목명","품명","품목명(규격)","품목명[규격]"]),

      for(const r of rows.slice(hi+1)){
        const code=erpNorm(r[cC]); const d=ymd(r[cD]); if(!code || !d) continue;
        const v=cV!=null?erpNorm(r[cV]):"";
        const it=item(code); if(cN!=null && !it.n) it.n=erpNorm(r[cN]);
        const row={d, c:code, q:erpNum(r[cQ]), v, co:m.co, p:cP!=null?erpNum(r[cP]):0, a:cA!=null?erpNum(r[cA]):0, g:isGroup(v)};
        (buy?db.buys:db.sales).push(row);
        if(v && !row.g) (buy?db.supp:db.cust).add(v);
      }
    }else if(m.rep==="BOM"){
      const hi=hdr(rows,["생산품목코드","소모품목코드"]); if(hi<0) continue; const c=colsOf(rows,hi);
      const cP=c["생산품목코드"], cC=c["소모품목코드"], cMk=pick(c,["생산수량"]), cU=pick(c,["소요량"]), cPn=pick(c,["생산품목명"]), cCn=pick(c,["소모품목명"]);

        if(cPn!=null && !item(p).n) item(p).n=erpNorm(r[cPn]); if(cCn!=null && !item(ch).n) item(ch).n=erpNorm(r[cCn]);

      const cC=c["품목코드"], cQ=c["수량"], cV=pick(c,["거래처명","거래처"]), cS=pick(c,["진행상태","상태"]), cD=pick(c,["납기일자","납기일"]), cNo=pick(c,["일자-No.","일자-No","일자"]);
      const grace=new Date(); grace.setDate(grace.getDate()-30); const cut=grace.toISOString().slice(0,10);
      for(const r of rows.slice(hi+1)){
        const code=erpNorm(r[cC]); if(!code || /^합\s*계$/.test(code)) continue;
        const st=cS!=null?erpNorm(r[cS]):""; if(/완료|종결|마감|취소/.test(st)) continue;
        const due=cD!=null?ymd(r[cD]):""; if(due && due<cut) continue;      // 납기 30일 넘게 지난 건 나간 것으로 본다
        db.orders.push({c:code, q:erpNum(r[cQ]), v:cV!=null?erpNorm(r[cV]):"", due, no:cNo!=null?erpNorm(r[cNo]):"", co:m.co, st});
      }

  }
  if(poMeta){
    try{ const got=await MmsSp.download(PO_PATH,false); db.pos=JSON.parse(new TextDecoder().decode(got.bytes)); }catch(e){ console.warn("[발주] 목록을 못 읽었습니다", e); }
  }
  db.cust=[...db.cust]; db.supp=[...db.supp];
  DB=db; idbPut("db",{sig, ver:VER, db}).catch(()=>{});
  return db;
}
const VER=1;
function idb(){ return new Promise((ok,bad)=>{ const r=indexedDB.open("ask_dash",1); r.onupgradeneeded=()=>r.result.createObjectStore("kv"); r.onsuccess=()=>ok(r.result); r.onerror=()=>bad(r.error); }); }
async function idbGet(k){ try{ const d=await idb(); return await new Promise(ok=>{ const q=d.transaction("kv").objectStore("kv").get(k); q.onsuccess=()=>ok(q.result); q.onerror=()=>ok(null); }); }catch(e){ return null; } }
async function idbPut(k,v){ const d=await idb(); return new Promise((ok,bad)=>{ const t=d.transaction("kv","readwrite"); t.objectStore("kv").put(v,k); t.oncomplete=ok; t.onerror=()=>bad(t.error); }); }

/* ===================== 계산 ===================== */
const key=c=>String(c||"").trim().toUpperCase().replace(/\s+/g,"");
let CODEIDX=null;
function codeIdx(){ if(CODEIDX && CODEIDX.db===DB) return CODEIDX.m; const m={}; for(const c in DB.items) m[key(c)]=c; CODEIDX={db:DB,m}; return m; }
function monthsBack(n){ const d=new Date(); d.setDate(1); d.setMonth(d.getMonth()-n); return d; }
const ymOf=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");
// 품목의 월별 수요(지난달부터 12개월) — 바깥 판매 + 그 품목이 들어가는 제품 판매를 BOM 으로 푼 양 (그룹사 내부이동 제외)
let DEMAND=null;
function demand(){
  if(DEMAND && DEMAND.db===DB) return DEMAND.m;
  const idx={}; for(let i=1;i<=12;i++) idx[ymOf(monthsBack(i))]=i-1;
  const direct={};
  for(const r of DB.sales){ if(r.g) continue; const k=idx[r.d.slice(0,7)]; if(k==null) continue; (direct[r.c]=direct[r.c]||new Array(12).fill(0))[k]+=r.q; }
  const total={}; const add=(c,arr,mul)=>{ const t=(total[c]=total[c]||new Array(12).fill(0)); for(let i=0;i<12;i++) t[i]+=arr[i]*mul; };
  const stop=c=>{ const k=(DB.items[c]||{}).k; return k==="원재료"||k==="상품"; };
  for(const c in direct){
    add(c, direct[c], 1);
    if(!DB.bom[c] || stop(c)) continue;
    let budget=4000; const seen=new Set();
    (function walk(p, mul, depth){
      if(budget<=0 || depth>10 || seen.has(p)) return; seen.add(p);
      for(const [ch,per] of DB.bom[p]||[]){ if(--budget<=0) break; add(ch, direct[c], mul*per); if(DB.bom[ch] && !stop(ch)) walk(ch, mul*per, depth+1); }
      seen.delete(p);
    })(c, 1, 0);
  }
  DEMAND={db:DB, m:total}; return total;
}
// 월 예측 — 구매요청 대시보드 '발주 필요'와 같은 방식(12개월 가중평균 3/2/1, 대량 거래 달 보정)
function forecast(v){
  if(!v) return 0; v=v.slice(); const tot=v.reduce((a,b)=>a+b,0);
  if(tot>0){ const mx=Math.max(...v), k=v.indexOf(mx), rest=(tot-mx)/11; if(mx>3*rest && mx>=0.3*tot && v.filter(x=>x>0).length>=8) v[k]=rest; }
  const w=v.map((_,i)=>i<3?3:(i<6?2:1)); return v.reduce((a,x,i)=>a+x*w[i],0)/w.reduce((a,b)=>a+b,0);
}
function openOrderQty(c){ return DB.orders.filter(o=>o.c===c).reduce((s,o)=>s+o.q,0); }

/* ===================== 질문 알아듣기 ===================== */
function findCodes(q){
  const idx=codeIdx(), out=[];
  const toks=q.match(/[A-Za-z0-9][A-Za-z0-9._\-\/]{1,}/g)||[];
  for(const t of toks){ const c=idx[key(t)]; if(c && out.indexOf(c)<0) out.push(c); }
  return out;
}
function guessCodes(q){            // 정확한 코드가 없으면 일부 글자나 품명으로 찾는다
  const toks=(q.match(/[A-Za-z0-9][A-Za-z0-9._\-]{3,}/g)||[]).map(key);
  const words=(q.replace(/[A-Za-z0-9._\-]+/g," ").match(/[가-힣A-Za-z]{2,}/g)||[]).filter(w=>!STOP.test(w));
  const res=[];
  for(const c in DB.items){ if(skip(c)) continue; const kc=key(c), n=DB.items[c].n||"";
    if(toks.some(t=>kc.indexOf(t)>=0) || (words.length && words.every(w=>n.indexOf(w)>=0))) res.push(c); }
  return res;
}
const STOP=/^(재고|판매|구매|매입|단가|주문|입고|예정|부품|부족|몇|개월|버텨|버틸|지난달|이번달|이번주|다음주|올해|작년|최근|상위|순위|많이|팔린|팔림|품목|제품|상품|알려줘|보여줘|얼마|얼마에|샀|사온|들어오는|들어와|언제|있어|없어|태성|태성정밀|플로우텍|만들|생산|가능|개|수량|금액|거래처|구매처|판매처|확정|미출고|이번|지난|월|주|년)$/;
function findName(list, q){
  const nq=coName(q); let best="";
  for(const v of list){ const n=coName(v); if(n.length>=2 && nq.indexOf(n)>=0 && n.length>best.length) best=v; }
  if(best) return best;
  // 앞 두세 글자만 써도 찾는다 (예: '대림' → 대림바스)
  const words=(q.match(/[가-힣A-Za-z]{2,}/g)||[]).filter(w=>!STOP.test(w));
  for(const w of words){ const hit=list.filter(v=>coName(v).indexOf(w)===0); if(hit.length===1) return hit[0]; }
  return "";
}
// future: 입고 예정처럼 앞날을 묻는 질문 — '11월'은 올해(지났으면 내년) 11월
function period(q, def, future){
  const now=new Date(), Y=now.getFullYear(), M=now.getMonth(), d=x=>x.toISOString().slice(0,10);
  const loc=(y,m,dd)=>{ const t=new Date(y,m,dd); return t.getFullYear()+"-"+String(t.getMonth()+1).padStart(2,"0")+"-"+String(t.getDate()).padStart(2,"0"); };
  let m;
  if(/지난\s*달|전월|저번\s*달/.test(q)) return {from:loc(Y,M-1,1), to:loc(Y,M,0), label:"지난달"};
  if(/이번\s*달|이달|금월/.test(q)) return {from:loc(Y,M,1), to:loc(Y,M,now.getDate()), label:"이번 달"};
  if(/작년|전년|지난\s*해/.test(q)) return {from:(Y-1)+"-01-01", to:(Y-1)+"-12-31", label:(Y-1)+"년"};
  if(/올해|금년|이번\s*해/.test(q)) return {from:Y+"-01-01", to:loc(Y,M,now.getDate()), label:Y+"년"};
  if((m=q.match(/최근\s*(\d+)\s*개월/))) return {from:loc(Y,M-(+m[1]),now.getDate()+1), to:loc(Y,M,now.getDate()), label:"최근 "+m[1]+"개월"};
  if((m=q.match(/(?:(20\d{2})\s*년\s*)?(\d{1,2})\s*월/))){ let y=m[1]?+m[1]:Y, mm=+m[2]-1; if(!m[1] && !future && mm>M) y--; if(!m[1] && future && mm<M) y++; return {from:loc(y,mm,1), to:loc(y,mm+1,0), label:y+"년 "+(mm+1)+"월"}; }
  return def;
}
function topN(q, def){ const m=q.match(/(?:top|TOP|상위)\s*(\d+)|(\d+)\s*(?:위|개|등)/); return m ? Math.min(50, +(m[1]||m[2])) : def; }

function answer(qRaw){
  const q=qRaw.trim();
  INCL_ALLOY=/(잉곳|합금|광재)\s*(도\s*)?포함/.test(q);
  if(!DB) return "자료를 아직 불러오지 못했어요. 위의 <b>☁ 회사 계정으로 연결</b>을 눌러 주세요.";
  if(/^(도움|도움말|help|\?|사용법|뭘?\s*물어)/i.test(q)) return helpHtml();
  const codes=findCodes(q);
  const co=/플로우텍|플로텍|flowtech/i.test(q) ? "플로우텍" : (/태성/.test(q) ? "태성정밀" : "");
  const want={
    inc:/입고|들어오|들어와|도착|입고\s*예정/.test(q),
    bom:/bom|구성품|만들|생산\s*가능|부품\s*(부족|모자)|(부족|모자란)\s*부품/i.test(q),
    ord:/주문|수주|오더|미출고|확정/.test(q),
    buy:/구매|매입|단가|샀|사온|입고가|매입가/.test(q),
    sale:/판매|팔|매출|출고|순위|상위|top|많이/i.test(q),
    stock:/재고|몇\s*개|버텨|버틸|소진|남았|남아/.test(q),
  };
  if(want.inc && !want.buy) return incoming(q, codes);
  if(want.ord){ const cust=findName(DB.cust.concat(DB.orders.map(o=>o.v)), q); return orders(codes, cust); }
  if(want.buy){ const sup=findName(DB.supp, q); return purchases(codes, sup, q); }
  if(want.bom){ if(!codes.length) return choose(q, "BOM"); return bomCheck(codes[0], q); }
  if(want.sale && (!codes.length || /순위|상위|top|많이/i.test(q))){ const cust=findName(DB.cust, q); return salesTop(q, co, cust); }
  if(want.sale) return itemSales(codes[0], q);
  if(want.stock){ if(!codes.length) return choose(q, "재고"); return codes.map(stockCard).join("<hr>"); }
  if(codes.length) return overview(codes[0]);
  const cust=findName(DB.cust, q); if(cust) return salesTop(q, co, cust);
  const g=guessCodes(q); if(g.length) return choose(q, "");
  return "무슨 말인지 잘 모르겠어요 😅<br>" + helpHtml();
}
function choose(q, intent){
  const g=guessCodes(q).slice(0,12);
  if(!g.length) return `어떤 품목인지 찾지 못했어요. <b>품목코드</b>를 같이 써 주세요. 예) <code>717062 ${intent||"재고"}</code>`;
  if(g.length===1) return answer(g[0]+" "+q);
  return `어느 품목인가요? 눌러 주세요.<div class="pick">${g.map(c=>`<button class="chip" data-q="${esc(c+" "+(intent||""))}">${esc(c)} · ${esc((DB.items[c]||{}).n||"")}</button>`).join("")}</div>`;
}
function nameOf(c){ const it=DB.items[c]||{}; return `<span class="mono">${esc(c)}</span> ${esc(it.n||"")}`; }

function stockCard(c){
  const it=DB.items[c]||{}, v=demand()[c], f=forecast(v), oc=openOrderQty(c), free=(it.s||0)-oc;
  const cover=f>0 ? Math.max(0,free)/f : null;
  const tag = cover==null ? "" : cover<2 ? `<span class="tag red">위험</span>` : cover<4 ? `<span class="tag amb">주의</span>` : `<span class="tag ok">여유</span>`;
  const lastBuy=DB.buys.filter(b=>b.c===c && !b.g).sort((a,b)=>b.d.localeCompare(a.d))[0];
  return `<h4>${nameOf(c)} ${tag}</h4>
    <div class="grid">

// 해외 구매 — 이카운트 구매현황의 '단가'는 외화, '공급가액'은 원화로 들어온다.

function fxOf(b){
  if(!(b.q>0) || !(b.a>0) || !(b.p>0)) return null;
  const rate=b.a/b.q/b.p;
  if(rate>=700 && rate<=2500) return {cur:"USD", sym:"$", rate};
  if(rate>=120 && rate<400) return {cur:"CNY", sym:"¥", rate};
  return null;                                   // 비율이 1 언저리면 원화 거래
}
const krwUnit=b=> b.q>0 && b.a>0 ? b.a/b.q : b.p;
const fxCell=b=>{ const f=fxOf(b); return f ? f.sym+(Math.round(b.p*100)/100).toLocaleString()+` <span class="sm">${f.cur}</span>` : "-"; };
const fxNote=b=>{ const f=fxOf(b); return f ? `${f.sym}${(Math.round(b.p*100)/100).toLocaleString()} ${f.cur} · 환율 약 ${Math.round(f.rate).toLocaleString()} · ` : ""; };
function bomCheck(c, q){
  const kids=DB.bom[c];
  if(!kids) return `<h4>${nameOf(c)}</h4>BOM 에 등록된 부품이 없어요. 완제품으로 사 오는 품목일 수 있어요.`;
  const m=q.match(/(\d[\d,]*)\s*개\s*(?:만들|생산|조립)/); const want=m?+m[1].replace(/,/g,""):0;
  const rows=kids.map(([ch,per])=>{ const s=Math.max(0,(DB.items[ch]||{}).s||0); return {ch, per, s, can:Math.floor(s/per), need:want?Math.max(0,Math.ceil(per*want-s)):0}; })
    .sort((a,b)=>a.can-b.can);
  const max=rows.length?rows[0].can:0;
  return `<h4>${nameOf(c)} · BOM 부품 재고</h4>
    <div class="big">${want?(rows.some(r=>r.need>0)?`${fmt(want)}개 만들려면 부족한 부품 ${rows.filter(r=>r.need>0).length}개`:`${fmt(want)}개 만들 수 있어요 👍`):`지금 재고로 최대 ${fmt(max)}개 생산 가능`}</div>
    <div class="sm">제품 재고 ${fmt((DB.items[c]||{}).s||0)}개 · 한 단계 아래 부품 기준 (불량창고 제외 재고)</div>
    <table><tr><th>부품</th><th class="n">개당</th><th class="n">재고</th><th class="n">만들 수 있는 수</th>${want?`<th class="n">부족</th>`:""}</tr>
    ${rows.map(r=>`<tr><td><span class="mono">${esc(r.ch)}</span> ${esc((DB.items[r.ch]||{}).n||"")}</td><td class="n">${fmt(r.per)}</td><td class="n">${fmt(r.s)}</td><td class="n">${r.can===max?`<b style="color:var(--risk-1)">${fmt(r.can)}</b>`:fmt(r.can)}</td>${want?`<td class="n">${r.need?`<b style="color:var(--risk-1)">${fmt(r.need)}</b>`:"-"}</td>`:""}</tr>`).join("")}</table>
    <div class="sm">"${esc(c)} 500개 만들려면?"처럼 물으면 부족 수량을 계산해요.</div>`;
}

  catch(e){ console.warn(e); }
})();
})();
